org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
android.nonTransitiveRClass=true

# JDK Configuration
# IMPORTANT: This project requires JDK 17 (not JDK 21 or other versions)
# Force Gradle to use JDK 17 (found on your system)
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

# Gradle Configuration
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Temporarily disable configuration cache until JDK issue is resolved
# Re-enable after confirming JDK 17 is working
org.gradle.configuration-cache=false

# Kotlin Configuration
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true
